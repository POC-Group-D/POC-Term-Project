# Override that replaces recommendationservice v1 with the v2 AI agent.
#
#   docker compose -f docker-compose.yml -f docker-compose.v2.yml up -d --build
#
# Put HF_TOKEN (and optionally HF_MODEL, COSMOS_ENDPOINT, COSMOS_KEY) in .env.
# Without HF_TOKEN the agent still runs but every request uses the v1 fallback.

services:
  recommendationservice:
    build:
      context: ../../agent-service
    image: poc-group-d/recommendationservice:v2-local
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      # Provider list prices (USD per million tokens) for the cost estimate.
      MODEL_INPUT_PRICE_PER_MTOK: ${MODEL_INPUT_PRICE_PER_MTOK:-0.01}
      MODEL_OUTPUT_PRICE_PER_MTOK: ${MODEL_OUTPUT_PRICE_PER_MTOK:-0.03}
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-}
      COSMOS_KEY: ${COSMOS_KEY:-}
