# Build our container images and publish them to GitHub Container Registry
# (ghcr.io/poc-group-d/...), so Azure Container Apps can pull them.
#
# Only the images we change are built:
#   recommendationservice-v2  the AI agent (agent-service/); its Dockerfile runs the unit tests
#   productcatalogservice     upstream image + the 200-product catalog (catalog/)
#   frontend                  upstream image + pictures for the new products (catalog/)
#
# Tags: sha-<commit> on every build, the branch name, and "latest" on main.
# GitHub Actions and GHCR are free for this public repository.

name: Build and publish images

on:
  push:
    branches: ["**"]
    paths:
      - "agent-service/**"
      - "catalog/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REGISTRY: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo
  UPSTREAM_TAG: v0.10.7

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: recommendationservice-v2
            context: agent-service
            base: ""
          - image: productcatalogservice
            context: catalog/productcatalogservice
            base: productcatalogservice
          - image: frontend
            context: catalog/frontend
            base: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        # Registry paths must be lowercase; the organization is POC-Group-D.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.base != '' && format('BASE_IMAGE={0}/{1}:{2}', env.UPSTREAM_REGISTRY, matrix.base, env.UPSTREAM_TAG) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
